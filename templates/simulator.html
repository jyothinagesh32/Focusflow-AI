{% extends "base.html" %}
{% block content %}
<div class="card">
<h1>What-If Simulator</h1>
<p>Change study habits and estimate the resulting productivity score.</p>
<form method="post" class="form-grid">
<label>Study hours<input type="number" step="0.1" name="study_hours" value="4"></label>
<label>Focus minutes<input type="number" name="focus_minutes" value="120"></label>
<label>Sleep hours<input type="number" step="0.1" name="sleep_hours" value="8"></label>
<label>Screen time<input type="number" step="0.1" name="screen_time" value="3"></label>
<label>Distraction level<input type="number" name="distraction_level" min="0" max="10" value="3"></label>
</div>
<button class="btn">Run Simulation</button>
</form>
{% if result is not none %}
<hr><h2>Simulated Productivity Score: {{ result }}%</h2>
{% endif %}
</div>
{% endblock %}
