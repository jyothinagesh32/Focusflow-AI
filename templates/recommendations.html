{% extends "base.html" %}{% block content %}<div class="card"><h1>Adaptive Recommendations</h1>{% for r in recommendations %}<div class="recommendation"><p>{{ r.recommendation }}</p><small>Status: {{ r.status }}</small><form method="post"><input type="hidden" name="id" value="{{ r.id }}"><button class="btn" name="status" value="helpful">Helpful</button><button class="btn" name="status" value="not_helpful">Not helpful</button><button class="btn" name="status" value="completed">Completed</button><button class="btn" name="status" value="dismissed">Dismiss</button></form></div>{% else %}<p>No open recommendations right now. Add study records to refresh your advice.</p>{% endfor %}</div>{% endblock %}
